spring:
  application:
    name: ecommerce

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/Ecommerce}
    username: ${DB_USERNAME:ecommerce_user}
    password: ${DB_PASSWORD:ecommerce_pass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

external:
  products:
    base-url: https://dummyjson.com